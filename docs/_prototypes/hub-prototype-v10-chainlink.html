<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoBasics — Buck Flight + Chain Link Prototype (DEMO ONLY)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'DM Sans',sans-serif;
  background:#05060c;
  color:#fff;
  position:relative;
  cursor:none; /* Buck IS the cursor */
}
canvas{position:fixed;inset:0;z-index:0;display:block;}

.chrome{position:relative;z-index:3;display:flex;flex-direction:column;height:100vh;pointer-events:none;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:24px 32px;}
.logo{font-size:.85rem;font-weight:900;letter-spacing:.05em;}
.logo span{color:#FFD600;}
.navcta{font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;background:#FFD600;color:#0c1520;padding:9px 16px;border-radius:9999px;}

.hero{text-align:center;padding:8px 24px 0;}
.eyebrow{font-size:.66rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#7FD8FF;margin-bottom:10px;}
.h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15;}
.h1 em{font-style:italic;color:#FFD600;}
.sub{margin-top:10px;font-size:.85rem;color:rgba(255,255,255,0.55);max-width:480px;margin-left:auto;margin-right:auto;}

.demo-note{margin-top:14px;font-size:.68rem;color:rgba(255,255,255,0.35);}

.toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(16px);
  z-index:5;background:#FFD600;color:#0c1520;font-weight:900;font-size:.85rem;
  padding:12px 22px;border-radius:9999px;opacity:0;transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="chrome">
  <div class="nav">
    <div class="logo">Crypto<span>Basics</span></div>
    <div class="navcta">Get Started</div>
  </div>
  <div class="hero">
    <div class="eyebrow">You are here: The Chain</div>
    <h1 class="h1">Fly Buck down the <em>blockchain</em>.<br>Land wherever you want to go.</h1>
    <p class="sub">Your cursor is Buck. Steer him up and down — hover a stop long enough and he lands on it.</p>
    <div class="demo-note">Move the mouse to fly. Hold still over a block to land.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutBlocks();
}
window.addEventListener('resize', resize);

// ===== calm cinematic starfield (from the space-background pass) =====
// fixed positions, brightness breathes, mixed star temperature, a few bloomed
// hero stars — no drift, no color wash.
var STAR_COUNT = 220;
var stars = [];
var STAR_COLORS = ['255,255,255','255,255,255','210,225,255','255,236,196','255,244,224'];
function initStars(){
  stars = [];
  for(var i=0;i<STAR_COUNT;i++){
    var big = Math.random() < 0.05;
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: big ? (1.7+Math.random()*1.3) : (Math.random()*1.0+0.25),
      color: STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)],
      tw: Math.random()*Math.PI*2,
      twSpeed: big ? (0.004+Math.random()*0.006) : (0.008+Math.random()*0.03),
      twDepth: big ? (0.5+Math.random()*0.3) : (0.55+Math.random()*0.45),
      bloom: big
    });
  }
}

// ===== the chain: a gentle horizontal path with a handful of stops on it =====
var STOPS = [
  {key:'courses', label:'Courses', icon:'📚'},
  {key:'news', label:'Crypto News', icon:'📰'},
  {key:'jargon', label:'Jargon Buster', icon:'🔍'},
  {key:'reg', label:'Regulation Tracker', icon:'🏛️'},
  {key:'story', label:'Our Story', icon:'👋'}
];
var blocks = [];
function layoutBlocks(){
  blocks = STOPS.map(function(s, i){
    var fx = (i+1)/(STOPS.length+1);
    return {
      key: s.key, label: s.label, icon: s.icon,
      x: fx*W,
      baseY: H*0.58,
      wobble: Math.random()*Math.PI*2,
      landed: 0 // 0..1 landed amount, eased
    };
  });
}

// ===== Buck-as-cursor =====
var buckImg = new Image();
buckImg.src = '../images/buck.webp';
var buckReady = false;
buckImg.onload = function(){ buckReady = true; };

var mouseX = null, mouseY = null;
var buckX = 0, buckY = 0; // eased position — slight lag so it reads as flight, not a snap-to cursor
var lastMouseX = 0, lastMouseY = 0;
var vx = 0, vy = 0;

window.addEventListener('mousemove', function(e){
  mouseX = e.clientX; mouseY = e.clientY;
});
window.addEventListener('mouseleave', function(){ mouseX = null; });

var toastEl = document.getElementById('toast');
var toastTimer = null;
function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
}

var landedKey = null;
var t = 0;

// path the chain (and the blocks) sit on — one shared formula so everything lines up
function pathY(x, tt){
  return H*0.58 + Math.sin(x*0.006 + tt*0.006)*18;
}

// draws the chain as real interlocking links (stroked hollow capsules,
// alternating orientation) instead of a plain glowing line
var LINK_LEN = 30, LINK_W = 13, LINK_THICK = 4, LINK_SPACING = 17;
function drawChain(tt){
  var count = Math.ceil(W / LINK_SPACING) + 2;
  ctx.save();
  for(var i=0;i<count;i++){
    var x = i*LINK_SPACING;
    var y = pathY(x, tt);
    // local tangent, so links follow the curve instead of sitting flat
    var y2 = pathY(x+2, tt);
    var tangent = Math.atan2(y2-y, 2);
    var orient = (i % 2 === 0) ? tangent : tangent + Math.PI/2;

    // a slow, faint shimmer pulse traveling along the chain — subtle, not busy
    var pulse = 0.5 + 0.5*Math.sin((x - tt*2.2) * 0.02);
    var alpha = 0.32 + pulse*0.28;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(orient);
    ctx.beginPath();
    if(ctx.roundRect){
      ctx.roundRect(-LINK_LEN/2, -LINK_W/2, LINK_LEN, LINK_W, LINK_W/2);
    } else {
      ctx.rect(-LINK_LEN/2, -LINK_W/2, LINK_LEN, LINK_W);
    }
    ctx.lineWidth = LINK_THICK;
    ctx.strokeStyle = 'rgba(127,216,255,'+alpha.toFixed(2)+')';
    ctx.shadowColor = '#7FD8FF';
    ctx.shadowBlur = 6 + pulse*8;
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}

function tick(){
  t += 1;
  if(mouseX === null){ mouseX = W*0.4; mouseY = H*0.45; }

  var px = buckX, py = buckY;
  buckX += (mouseX - buckX) * 0.16;
  buckY += (mouseY - buckY) * 0.16;
  vx = buckX - px; vy = buckY - py;

  ctx.clearRect(0,0,W,H);

  // near-black cinematic base — no flat color wash
  ctx.fillStyle = '#020306';
  ctx.fillRect(0,0,W,H);
  var vg = ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(18,26,48,0.5)');
  vg.addColorStop(0.6,'rgba(8,11,22,0.32)');
  vg.addColorStop(1,'rgba(0,0,0,0.85)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // stars hold position, only brightness breathes — calm, not drifting/strobing
  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var raw = 0.5+0.5*Math.sin(t*s.twSpeed + s.tw);
    var tw = (1-s.twDepth) + s.twDepth*raw;
    if(s.bloom){
      var haloR = s.r*7;
      var halo = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,haloR);
      halo.addColorStop(0,'rgba('+s.color+','+(tw*0.35).toFixed(2)+')');
      halo.addColorStop(1,'rgba('+s.color+',0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(s.x, s.y, haloR, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba('+s.color+','+tw.toFixed(2)+')';
    ctx.fill();
  }

  // the chain — actual interlocking links along the same gentle path the
  // blocks sit on, instead of a plain glowing line
  drawChain(t);

  // block-stops on the chain
  var nearestDist = Infinity, nearestKey = null;
  for(var i=0;i<blocks.length;i++){
    var b = blocks[i];
    var y = b.baseY + Math.sin(b.x*0.006 + t*0.006)*18 + Math.sin(t*0.02 + b.wobble)*4;
    b._y = y;
    var d = Math.hypot(buckX - b.x, buckY - y);
    if(d < nearestDist){ nearestDist = d; nearestKey = b.key; }
  }
  var LAND_RADIUS = 60;
  var isLanded = nearestDist < LAND_RADIUS;
  if(isLanded && landedKey !== nearestKey){
    landedKey = nearestKey;
    var lb = blocks.filter(function(b){return b.key===nearestKey;})[0];
    showToast('Landed on ' + lb.label + ' — click to open');
  } else if(!isLanded){
    landedKey = null;
  }

  for(var i=0;i<blocks.length;i++){
    var b = blocks[i];
    var y = b._y;
    var target = (b.key === landedKey) ? 1 : 0;
    b.landed += (target - b.landed) * 0.15;

    var r = 30 + b.landed*8;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(b.x-r, y-r, r*2, r*2, 14) : ctx.rect(b.x-r, y-r, r*2, r*2);
    ctx.fillStyle = 'rgba(16,22,42,0.85)';
    ctx.fill();
    ctx.lineWidth = 2 + b.landed*2;
    ctx.strokeStyle = b.landed > 0.05 ? '#FFD600' : 'rgba(127,216,255,0.5)';
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 6 + b.landed*18;
    ctx.stroke();
    ctx.restore();

    ctx.shadowBlur = 0;
    ctx.font = (18+b.landed*4)+'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.icon, b.x, y-4);

    ctx.font = '700 10px DM Sans, sans-serif';
    ctx.fillStyle = b.landed > 0.05 ? '#FFD600' : 'rgba(255,255,255,0.55)';
    ctx.fillText(b.label, b.x, y + r + 14);
  }

  // Buck — the cursor itself. Banks like a wing based on vertical velocity,
  // small flap-bob so it reads as flight, squashes slightly when landed.
  if(buckReady){
    var bank = Math.max(-0.35, Math.min(0.35, vy*0.05));
    var flap = Math.sin(t*0.25) * (isLanded ? 1.5 : 4);
    var scale = isLanded ? 0.92 : 1;

    var gg = ctx.createRadialGradient(buckX, buckY+18, 2, buckX, buckY+18, 40);
    gg.addColorStop(0, isLanded ? 'rgba(255,214,0,0.4)' : 'rgba(127,216,255,0.25)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.ellipse(buckX, buckY+18, 40, 14, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(buckX, buckY + flap);
    ctx.rotate(bank);
    ctx.scale(scale, scale);
    var size = 64;
    ctx.drawImage(buckImg, -size/2, -size/2, size, size);
    ctx.restore();
  }

  requestAnimationFrame(tick);
}

window.addEventListener('click', function(){
  if(landedKey){
    var lb = blocks.filter(function(b){return b.key===landedKey;})[0];
    showToast('→ Opening ' + lb.label + ' (demo — not wired up yet)');
  }
});

resize();
initStars();
requestAnimationFrame(tick);
</script>

</body>
</html>
